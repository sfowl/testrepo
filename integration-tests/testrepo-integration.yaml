apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: testrepo-integration-test
spec:
  params:
    - name: SNAPSHOT
      type: string
      description: |
        For simplicity, we expect a single component inside our snapshot
          {
            "components": [
              {
                "containerImage": "quay.io/example/repo:latest"
              }
            ]
          }
  tasks:
    - name: test-component
      params:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
        steps:
          - name: test-output
            image: quay.io/konflux-ci/konflux-test:latest
            env:
              - name: SNAPSHOT
                value: "$(params.SNAPSHOT)"
              - name: NAMESPACE
                value: "$(context.pipelineRun.namespace)"
            script: |
              #!/usr/bin/bash
              set -euxo pipefail

              IMAGE=$(echo "$SNAPSHOT" | jq -r '.components[0].containerImage')
              echo "Extracted image: $IMAGE"
              kubectl delete deployment test-component --ignore-not-found -n $NAMESPACE
              kubectl create deployment test-component -n $NAMESPACE --image=$IMAGE
              kubectl wait --for=condition=Running deployment/test-component --timeout=120s
              # LOGS=$(kubectl logs deployment/test-component -n $NAMESPACE)
              kubectl delete deployment test-component --ignore-not-found test-hello -n $NAMESPACE
